# Cap container logs — an unrotated backend log once filled the 8.7 GB disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  backend:
    image: ghcr.io/ulrichfrank/molthar-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - EXTRA_ORIGINS=https://molthar.${APPS_DOMAIN:?APPS_DOMAIN required}
      - NPC_DATA_DIR=/app/data-npc
    volumes:
      - ./data:/app/data
      # NPC seat credentials. Without this mount every deploy locks the bots out
      # of their own seats and running matches hang on the NPC's turn.
      - ./data-npc:/app/data-npc
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.molthar-api.rule=Host(`molthar-api.${APPS_DOMAIN}`)"
      - "traefik.http.routers.molthar-api.entrypoints=websecure"
      - "traefik.http.routers.molthar-api.tls=true"
      - "traefik.http.routers.molthar-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.molthar-api.tls.domains[0].main=*.${APPS_DOMAIN}"
      - "traefik.http.services.molthar-api.loadbalancer.server.port=3001"

  frontend:
    image: ghcr.io/ulrichfrank/molthar-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.molthar.rule=Host(`molthar.${APPS_DOMAIN}`)"
      - "traefik.http.routers.molthar.entrypoints=websecure"
      - "traefik.http.routers.molthar.tls=true"
      - "traefik.http.routers.molthar.tls.certresolver=letsencrypt"
      - "traefik.http.routers.molthar.tls.domains[0].main=*.${APPS_DOMAIN}"
      - "traefik.http.services.molthar.loadbalancer.server.port=80"

networks:
  web:
    external: true
