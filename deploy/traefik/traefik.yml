api:
  dashboard: false
  insecure: false

log:
  level: INFO

accessLog: {}

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: web
  # Apps outside Docker (e.g. Ausgebremst as systemd service): one file per app
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: ulrich.frank@web.de
      storage: /acme/acme.json
      dnsChallenge:
        provider: netcup
        delayBeforeCheck: 120
